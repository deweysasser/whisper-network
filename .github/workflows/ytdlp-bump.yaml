# Weekly: bump the pinned yt-dlp release (and its checksums) in the
# Dockerfile's downloader target and open a PR. yt-dlp breaks whenever a site
# changes, so the downloader image should track upstream closely. deno is
# pinned in the Dockerfile too but is bumped by hand.
#
# Pull requests opened with GITHUB_TOKEN do not start other workflows; close
# and reopen the PR (or push to it) to run CI.
name: Bump yt-dlp

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the Dockerfile
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)"
          if ! [[ "$latest" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "unexpected yt-dlp release tag: $latest" >&2
            exit 1
          fi
          current="$(sed -n 's/^ARG YTDLP_VERSION=//p' Dockerfile)"
          echo "current=$current latest=$latest"
          if [[ "$latest" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sums="$(mktemp)"
          gh release download "$latest" -R yt-dlp/yt-dlp -p SHA2-256SUMS -O "$sums" --clobber
          amd64="$(awk '$2 == "yt-dlp_linux" {print $1}' "$sums")"
          arm64="$(awk '$2 == "yt-dlp_linux_aarch64" {print $1}' "$sums")"
          for h in "$amd64" "$arm64"; do
            [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "missing or malformed checksum" >&2; exit 1; }
          done
          sed -i \
            -e "s/^ARG YTDLP_VERSION=.*/ARG YTDLP_VERSION=$latest/" \
            -e "s/^ARG YTDLP_SHA256_AMD64=.*/ARG YTDLP_SHA256_AMD64=$amd64/" \
            -e "s/^ARG YTDLP_SHA256_ARM64=.*/ARG YTDLP_SHA256_ARM64=$arm64/" \
            Dockerfile
          {
            echo "changed=true"
            echo "version=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          branch="bump/yt-dlp-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Dockerfile
          git commit -m "chore(docker): bump yt-dlp to ${VERSION}"
          git push --force origin "$branch"
          if [[ -n "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]]; then
            echo "PR for $branch already open"
            exit 0
          fi
          gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
            --title "chore(docker): bump yt-dlp to ${VERSION}" \
            --body "Automated weekly bump of the pinned yt-dlp release and its linux checksums (from the release's SHA2-256SUMS) in the Dockerfile's downloader target. The downloader image build verifies the checksums."
