on:
  # main runs on push (and publishes images); everything else runs as a PR.
  # pull_request (not push) is what reports checks on PRs from forks, and
  # using only one trigger per commit avoids duplicate runs on our own PRs.
  push:
    branches: [main]
  pull_request:

name: Build

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO: ${{github.repository}}
  STATICCHECK_VERSION: 2026.2.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  build:
    name: Run checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test (race detector)
        run: make test-race

      - name: Build
        run: make

  fuzz-smoke:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Short pass over the hostile-input parsers (see the Makefile for targets
      # and durations).
      - name: Fuzz
        run: make fuzz

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@"${STATICCHECK_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"

      - name: staticcheck
        run: staticcheck ./...

      - name: govulncheck
        run: govulncheck ./...

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  # Images are built only from commits that passed every check, so a failing
  # commit can never publish an image. Only the default branch publishes;
  # other branches build to check the Dockerfile and warm nothing else.
  docker:
    name: Docker images
    needs: [build, fuzz-smoke, lint, format]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      push: ${{ github.ref_name == github.event.repository.default_branch }}
      tag: br-${{ github.ref_name }}
