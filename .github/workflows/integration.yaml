name: Integration

# End-to-end test of the compose stack (server, workers, real ffmpeg and
# whisper.cpp, VictoriaMetrics and VictoriaLogs). Slow, so it runs nightly and
# on demand rather than on every push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: make integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run integration test
        run: make integration

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "=== $c"; docker logs --tail 200 "$c" 2>&1 || true
          done
