name: Release

on:
  push:
    tags: [ v* ]

permissions:
  contents: read

env:
  REPO: ${{github.repository}}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GOOS: [linux, darwin, windows]
        GOARCH: [amd64, arm64]
        include:
          - GOOS: windows
            ext: .exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Repo Name
      id: repo-name
      run: echo "name=$(basename "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"

    - name: Test
      run: go test -v ./...

    - name: Build
      run: make package PROGRAM="bin/${GOOS}-${GOARCH}/${NAME}${EXT}" PACKAGE="dist/${NAME}-${GOOS}-${GOARCH}.zip"
      env:
        GOOS: ${{matrix.GOOS}}
        GOARCH: ${{matrix.GOARCH}}
        NAME: ${{steps.repo-name.outputs.name}}
        EXT: ${{matrix.ext}}

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: artifacts-${{matrix.GOOS}}-${{matrix.GOARCH}}
        path: dist
        retention-days: 1
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REF_NAME: ${{ github.ref_name }}
    needs:
      - build
      - docker-build
    steps:
    - name: Check for release candidate
      id: rc-check
      run: |
        if [[ "$REF_NAME" =~ -rc\. ]]; then
          echo "is_rc=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_rc=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Download Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: artifacts-*
        path: artifacts
        merge-multiple: true

    - name: Install ChangeLog generator
      run: |
        # sha256 of the official v0.15.1 linux_amd64 asset (from its checksums.txt)
        archive=git-chglog_0.15.1_linux_amd64.tar.gz
        wget "https://github.com/git-chglog/git-chglog/releases/download/v0.15.1/${archive}"
        echo "5247e4602bac520e92fca317322fe716968a27aab1d91706f316627e3a3ee8e6  ${archive}" | sha256sum -c -
        tar xzf "$archive" git-chglog

    - name: Generate Changelog for ${{ github.ref_name }}
      id: generate-changelog
      run: PATH="${PATH}:." make CHANGELOG.md

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: ./artifacts/*
        body_path: ./CHANGELOG.md
        draft: ${{ steps.rc-check.outputs.is_rc == 'true' }}
        prerelease: ${{ steps.rc-check.outputs.is_rc == 'true' }}

  # Release images (including latest/stable) are published only after the
  # release's tests pass. They are rebuilt rather than promoted from the main
  # build so the binaries report the release version; the native runners and
  # the default branch's build cache keep this fast.
  docker-build:
    name: Release images
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      push: true
      tag: ${{ github.ref_name }}
      release: true
