# Reusable workflow: build the worker, server and downloader images natively per
# architecture (no QEMU), then publish multi-arch manifests.
#
# Each target × architecture builds on a native runner with its own build
# cache scope, so the expensive whisper.cpp stage is rebuilt only when the
# Dockerfile's pinned whisper.cpp commit changes. Release runs on tags can
# read the default branch's cache, so a release reuses what main built.
name: Images

on:
  workflow_call:
    inputs:
      push:
        description: Publish the images (otherwise build only).
        type: boolean
        required: true
      tag:
        description: Image tag; characters outside [A-Za-z0-9_.-] become '-'.
        type: string
        required: true
      release:
        description: Also move latest/stable for final (non pre-release) tags.
        type: boolean
        default: false

permissions:
  contents: read

env:
  REPO: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [worker, server, downloader]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute image name and version
        run: |
          {
            echo "IMAGE=ghcr.io/${REPO,,}"
            echo "VERSION=$(./utils/version.sh)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the merge job attaches tags to the
      # multi-arch manifest. Without push, the image is only built.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.VERSION }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Record digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish ${{ matrix.target }} manifest
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [worker, server, downloader]
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.target }}-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # worker: <tag>[, latest, stable]; server: <tag>-server[, latest-server,
      # stable-server]; downloader: <tag>-downloader[, latest-downloader,
      # stable-downloader]. Only final release tags (no '-' suffix, e.g. not
      # v1.2.0-rc.1) move latest and stable.
      - name: Create and push the multi-arch manifest
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO,,}"
          # Docker tags allow [A-Za-z0-9_.-], at most 128 chars. '-' is last in
          # the set so tr reads it literally, not as a range.
          tag="$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
          if [[ -z "$tag" || "$tag" == "br-" ]]; then
            echo "refusing to publish an empty or bare image tag (input: '$TAG')" >&2
            exit 1
          fi
          suffix=""
          case "$TARGET" in
            server) suffix="-server" ;;
            downloader) suffix="-downloader" ;;
          esac
          tags=(-t "${image}:${tag}${suffix}")
          if [[ "$RELEASE" == "true" && "$tag" != *-* ]]; then
            tags+=(-t "${image}:latest${suffix}" -t "${image}:stable${suffix}")
          fi
          sources=()
          for f in digests/*; do
            sources+=("${image}@sha256:$(basename "$f")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${image}:${tag}${suffix}"
